<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Include Google reCAPTCHA API script -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

    <div class="form-container">
        <h2>Get in Touch</h2>
        <form id="contactForm" onsubmit="return handleFormSubmit(event)">
            
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your Name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="4" required placeholder="Your message here..."></textarea>
            </div>

            <!-- Google reCAPTCHA v2 Widget (Replace sitekey with your actual Google reCAPTCHA site key) -->
            <div class="g-recaptcha" data-sitekey="YOUR_RECAPTCHA_SITE_KEY"></div>

            <button type="submit" class="submit-btn">Send Message</button>
            <p id="errorMsg" class="error-text"></p>
        </form>
    </div>

    <!-- Link to external JavaScript -->
    <script src="script.js"></script>
</body>
</html>
